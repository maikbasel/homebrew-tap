name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Recent Homebrew needs a rootless `bwrap` for the Linux sandbox; the
      # ubuntu runner image doesn't ship it, so `brew doctor` (run by
      # `brew test-bot --only-setup`) fails. Install it on Linux only.
      - name: Install bubblewrap (Linux sandbox dependency)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Equivalent to `brew test-bot --only-tap-syntax`, but the audit skips the
      # `version` check. cargo-dist hardcodes an explicit `version` in the
      # generated formula; newer Homebrew scans the same version from the URL and
      # audits it as redundant. There is no cargo-dist knob to drop it, so skip
      # only that check while keeping style + every other audit as a real gate.
      - run: brew style maikbasel/homebrew-tap
      - run: brew audit --tap=maikbasel/homebrew-tap --except=version
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
